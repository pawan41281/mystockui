<div class="row div-margin-botton">

    <form #form="ngForm" class="row g-3 needs-validation" novalidate>
        <div class="col-md-3">
            <label for="orderNumber" class="form-label fw-bold">Order Number</label>
            <input type="text" class="form-control" maxlength="8" name="orderNumber" [(ngModel)]="filterObj.ordernumber"
                id="orderNumber">
        </div>

        <div class="col-md-3">
            <label for="party" class="form-label fw-bold">Client</label>
            <div class="input-group has-validation">
                <select class="form-select" name="party" [(ngModel)]="filterObj.clientName" name="party">
                    <option value="">Select Options</option>
                    @for (party of dropdownData; track party.id) {
                    <option [value]="party.id">{{ party.clientName }}</option>
                    }
                </select>
                <div class="invalid-feedback">
                    Please Select Party.
                </div>
            </div>
        </div>

        <div class="col-md-2">
            <label for="fromDate" class="form-label fw-bold">From Date</label>
            <div class="input-group">
                <input matInput [matDatepicker]="picker1" id="fromDate" [(ngModel)]="fromDate" name="fromDate"
                    class="form-control height-39" #orderDate="ngModel" />
                <span class="input-group-text height-39" style="cursor: pointer;">
                    <mat-datepicker-toggle [for]="picker1"></mat-datepicker-toggle>
                </span>
            </div>
            <mat-datepicker #picker1></mat-datepicker>
            <div class="text-danger">
                @if(orderDate.errors?.['required'] && orderDate.touched && orderDate.dirty) {
                <span>This field is mendatory</span>
                }
            </div>
        </div>
        <div class="col-md-2">
            <label for="toDate" class="form-label fw-bold">To Date</label>
            <div class="input-group">
                <input matInput [matDatepicker]="picker" id="toDate" [(ngModel)]="toDate" name="toDate"
                    class="form-control height-39" #orderDate="ngModel" />
                <span class="input-group-text height-39" style="cursor: pointer;">
                    <mat-datepicker-toggle [for]="picker"></mat-datepicker-toggle>
                </span>
            </div>
            <mat-datepicker #picker></mat-datepicker>
            <div class="text-danger">
                @if(orderDate.errors?.['required'] && orderDate.touched && orderDate.dirty) {
                <span>This field is mendatory</span>
                }
            </div>
        </div>
        <div class="col-md-1">
            <button class="margin-top-30 btn btn-primary" name="search" (click)="searchClientOrder()" id="search">
                Search
            </button>
        </div>
    </form>
</div>
<div class="row">
    <div class="col-2 div-margin-top align-left font-bold">Record Count : {{totalRecord}}</div>
    <div class="col-8"></div>
    <div class="col-2 align-right">
        <i class="bi bi-filetype-csv font-size-30" (click)="onBtnExport()"></i>
        <i class="bi bi-filetype-xls font-size-30" (click)="onBtnExportExcel()"></i>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <ag-grid-angular class="ag-theme-quartz" style="height: 500px;" [rowData]="clientOrders" [columnDefs]="colDefs"
            [defaultColDef]="defaultColDef" (gridReady)="onGridReady($event)" [pagination]="true"
            [paginationPageSize]="10" [paginationPageSizeSelector]="[10, 20, 50]" />
    </div>
</div>
